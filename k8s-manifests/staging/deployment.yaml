# lab-4/k8s-manifests/staging/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cicdlabs
  namespace: staging
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cicdlabs
  template:
    metadata:
      labels:
        app: cicdlabs
    spec:
      containers:
        - name: cicdlabs
          image: ghcr.io/oleglaptev/cicdlabs-staging:ee7caba
          ports:
            - containerPort: 5000
